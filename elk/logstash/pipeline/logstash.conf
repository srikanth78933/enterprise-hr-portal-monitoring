# Filebeat (DaemonSet in EKS) -> Logstash -> Elasticsearch data streams
#   HR Portal app logs      -> logs-hr_portal-<env>
#   all other containers    -> logs-kubernetes.container_logs-<env>

input {
  beats {
    port => 5044
  }
}

filter {
  if [kubernetes][labels][app_kubernetes_io/name] == "enterprise-hr-portal" {
    # Spring Boot default log line, e.g.
    # 2026-10-20T06:57:44.777Z  INFO 1 --- [enterprise-hr-portal] [           main] c.e.employee.EmployeeApplication : Started ...
    # (?m) lets the message include the following stack-trace lines joined by Filebeat
    grok {
      match => {
        "message" => "(?m)^%{TIMESTAMP_ISO8601:[@metadata][log_time]}\s+%{LOGLEVEL:[log][level]}\s+%{NUMBER:[process][pid]:int}\s+---\s+\[%{DATA:[service][name]}\]\s+\[\s*%{DATA:[process][thread][name]}\]\s+%{NOTSPACE:[log][logger]}\s+:\s+%{GREEDYDATA:[@metadata][log_message]}"
      }
      tag_on_failure => ["_springboot_parse_failure"]
    }

    if "_springboot_parse_failure" not in [tags] {
      date {
        match  => ["[@metadata][log_time]", "ISO8601"]
        target => "@timestamp"
      }
      mutate {
        replace => { "message" => "%{[@metadata][log_message]}" }
      }
    }

    mutate {
      add_field => { "[data_stream][dataset]" => "hr_portal" }
    }
  } else {
    mutate {
      add_field => { "[data_stream][dataset]" => "kubernetes.container_logs" }
    }
  }

  mutate {
    add_field => {
      "[data_stream][type]"      => "logs"
      "[data_stream][namespace]" => "${ENVIRONMENT}"
    }
  }
}

output {
  elasticsearch {
    hosts       => ["http://elasticsearch:9200"]
    user        => "logstash_writer"
    password    => "${LOGSTASH_WRITER_PASSWORD}"
    data_stream => "true"
  }
}
