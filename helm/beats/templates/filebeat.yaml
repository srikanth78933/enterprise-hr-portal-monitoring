# Filebeat: tails every container log on the node and sends it to Logstash on the ELK EC2 instance.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: filebeat
  labels:
    {{- include "beats.labels" . | nindent 4 }}
    app.kubernetes.io/name: filebeat
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: filebeat
  template:
    metadata:
      labels:
        {{- include "beats.labels" . | nindent 8 }}
        app.kubernetes.io/name: filebeat
      annotations:
        # Restart Filebeat when its configuration changes
        checksum/config: {{ include (print $.Template.BasePath "/filebeat-config.yaml") . | sha256sum | trunc 16 }}
    spec:
      serviceAccountName: filebeat
      terminationGracePeriodSeconds: 30
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # Run on every node, including tainted ones
      tolerations:
        - operator: Exists
      containers:
        - name: filebeat
          image: docker.elastic.co/beats/filebeat:{{ .Values.version }}
          args: ["-c", "/etc/filebeat.yml", "-e"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            # Needed to read the node's log files
            runAsUser: 0
          resources:
            {{- toYaml .Values.filebeat.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/filebeat.yml
              subPath: filebeat.yml
              readOnly: true
            - name: data
              mountPath: /usr/share/filebeat/data
            - name: varlog
              mountPath: /var/log
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: filebeat-config
            defaultMode: 0640
        # Keeps read positions across restarts, so logs are not sent twice
        - name: data
          hostPath:
            path: /var/lib/filebeat-data
            type: DirectoryOrCreate
        - name: varlog
          hostPath:
            path: /var/log
